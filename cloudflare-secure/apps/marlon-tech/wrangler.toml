name = "wd-marlon-tech-secure"
main = "src/worker.ts"
compatibility_date = "2026-08-28"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "wd-marlon-tech-db"
database_id = "4702d590-1034-4d88-995b-b9fa896898a7"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "wd-marlon-tech-media"

[vars]
APP_NAME = "Marlon Tech"
APP_KIND = "store"
ALLOW_REGISTRATION = "true"
SESSION_TTL_SECONDS = "43200"

# Configure with `wrangler secret put` — never write values here:
# PASSWORD_PEPPER
# IP_HASH_KEY

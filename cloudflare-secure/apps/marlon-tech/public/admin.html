<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administração segura</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="admin">
<section id="login"><p class="eyebrow">ACESSO RESTRITO</p><h1>Administração</h1><form id="loginForm"><label>Usuário<input name="identifier" autocomplete="username" autocapitalize="none" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" minlength="12" required></label><button class="primary">Entrar</button><p id="status"></p></form></section>
<section id="panel" hidden><div class="admin-top"><div><p class="eyebrow">PAINEL SEGURO</p><h1 id="user"></h1></div><button id="logout">Sair</button></div>
<section id="passwordGate" hidden><h2>Troque a senha provisória</h2><p>Antes de usar o painel, defina uma senha exclusiva para este projeto.</p><form id="passwordForm"><label>Senha atual<input name="current_password" type="password" autocomplete="current-password" minlength="12" required></label><label>Nova senha<input name="new_password" type="password" autocomplete="new-password" minlength="12" required></label><button class="primary">Atualizar senha</button><p data-password-status></p></form></section>
<div id="adminContent" class="admin-grid"><div><h2>Produto</h2><form id="productForm"><input name="id" type="hidden"><label>Nome<input name="name" required maxlength="120"></label><label>Slug<input name="slug" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*"></label><label>Descrição<textarea name="description" maxlength="2000"></textarea></label><label>Categoria<input name="category" required maxlength="60"></label><label>Preço em centavos<input name="price_cents" type="number" min="0" max="100000000" required></label><label>Estoque<input name="stock" type="number" min="0" max="1000000" required></label><button class="primary">Salvar</button><p data-status></p></form></div><div><h2>Catálogo</h2><div id="adminProducts"></div></div><div><h2>Contatos</h2><div id="leads"></div></div></div>
</section></main><script type="module" src="/admin.js"></script></body></html>

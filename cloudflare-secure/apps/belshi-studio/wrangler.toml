name = "wd-belshi-secure"
main = "src/worker.ts"
compatibility_date = "2026-08-28"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "wd-belshi-db"
database_id = "REPLACE_AFTER_D1_CREATE"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "wd-belshi-media"

[vars]
APP_NAME = "Belshi Studio"
APP_KIND = "studio"
ALLOW_REGISTRATION = "false"
SESSION_TTL_SECONDS = "43200"

# Configure with `wrangler secret put` — never write values here:
# PASSWORD_PEPPER
# IP_HASH_KEY

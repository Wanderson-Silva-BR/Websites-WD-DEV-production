<!doctype html><html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha conta | Marcell Celular</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/app.css?v=7"></head><body>
<header class="header"><div class="container header-main"><a class="brand" href="/"><img src="assets/logo-marcell.jpg" alt=""><div><strong>MARCELL CELULAR</strong><span>Área do cliente</span></div></a><div style="flex:1"></div><button class="icon-btn" id="themeBtn">☀️</button></div></header>
<main class="container page"><div id="authBox" class="auth-wrap"><div class="auth-card"><h1>Entre ou crie sua conta</h1><p class="msg">Use sua conta para salvar favoritos, endereços e acompanhar pedidos.</p><div style="display:flex;gap:8px"><button class="btn btn-primary" id="loginTab">Entrar</button><button class="btn btn-ghost" id="registerTab">Criar cadastro</button></div><form id="loginForm"><div class="field"><label>E-mail</label><input id="loginEmail" type="email" required></div><div class="field"><label>Senha</label><input id="loginPassword" type="password" required></div><button class="btn btn-brand" style="width:100%">Entrar</button></form><form id="registerForm" style="display:none"><div class="field"><label>Nome</label><input id="regName" required></div><div class="field"><label>E-mail</label><input id="regEmail" type="email" required></div><div class="field"><label>Telefone</label><input id="regPhone"></div><div class="field"><label>Senha</label><input id="regPassword" type="password" minlength="8" required></div><button class="btn btn-brand" style="width:100%">Cadastrar</button></form><p id="authMsg" class="msg"></p></div></div>
<div id="accountBox" style="display:none"><div class="section-title"><div><h1>Minha conta</h1><p id="welcome"></p></div><button class="btn btn-ghost" id="logoutBtn">Sair</button></div><div class="account-layout"><aside class="tabs"><button class="tab-btn active" data-tab="profile">Perfil</button><button class="tab-btn" data-tab="addresses">Endereços</button><button class="tab-btn" data-tab="favorites">Favoritos</button><button class="tab-btn" data-tab="orders">Pedidos</button></aside><section>
<div class="panel tab-panel active" id="profile"><h2>Meus dados</h2><form id="profileForm"><div class="field"><label>Nome</label><input id="profileName"></div><div class="field"><label>Telefone</label><input id="profilePhone"></div><button class="btn btn-brand">Salvar alterações</button></form></div>
<div class="panel tab-panel" id="addresses"><h2>Endereços</h2><div id="addressList"></div><form id="addressForm"><div class="form-grid"><div class="field"><label>CEP</label><input id="addrCep" required></div><div class="field"><label>Cidade</label><input id="addrCity" required></div><div class="field full"><label>Endereço</label><input id="addrLine" required></div></div><button class="btn btn-brand">Adicionar endereço</button></form></div>
<div class="panel tab-panel" id="favorites"><h2>Favoritos</h2><div id="favoriteList"></div></div>
<div class="panel tab-panel" id="orders"><h2>Pedidos</h2><div id="orderList"></div></div>
</section></div></div></main>
<script src="js/common.js?v=6.1"></script><script src="js/account.js?v=6.1"></script><script src="js/cookie-consent.js?v=7"></script><script type="module" src="js/motion-effects.js?v=7"></script></body></html>

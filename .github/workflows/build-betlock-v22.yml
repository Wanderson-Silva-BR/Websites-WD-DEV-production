name: Build BetLock BR v2.2.0

on:
  workflow_dispatch:
  push:
    branches: [ betlock-br ]
    paths:
      - '.github/workflows/build-betlock-v22.yml'
      - 'BetLock-BR/v2.2-source/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: betlock-br
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build release APK
        shell: bash
        run: |
          cd BetLock-BR/v2.2-source
          gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BetLockBR-v2.2.0-build
          path: BetLock-BR/v2.2-source/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Export Android apksigner
        shell: bash
        run: |
          VERSION="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          mkdir -p /tmp/android-apksigner-tool/lib
          cp "$ANDROID_HOME/build-tools/$VERSION/apksigner" /tmp/android-apksigner-tool/apksigner
          cp "$ANDROID_HOME/build-tools/$VERSION/lib/apksigner.jar" /tmp/android-apksigner-tool/lib/apksigner.jar
          printf '%s\n' "$VERSION" > /tmp/android-apksigner-tool/version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: /tmp/android-apksigner-tool

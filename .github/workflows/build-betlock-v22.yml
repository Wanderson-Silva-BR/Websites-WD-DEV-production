name: Build BetLock BR v2.2.0

on:
  workflow_dispatch:
  push:
    branches: [ betlock-br ]
    paths:
      - '.github/workflows/build-betlock-v22.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: betlock-br
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore v2.2.0 source
        shell: bash
        run: |
          mkdir -p /tmp/betlock-build
          base64 -d > /tmp/betlock-build/source.zip <<'BETLOCK_SOURCE'

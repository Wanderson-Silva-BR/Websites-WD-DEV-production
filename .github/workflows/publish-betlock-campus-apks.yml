name: Publish BetLock Campus APKs

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-betlock-campus-apks.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: betlock-br
      - name: Fetch validated APK artifacts
        shell: bash
        env:
          V1_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-1a34-820e-bc82-d6a91d4fe65a/raw?se=2026-09-12T23%3A10%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=4c303daa-b597-535c-b9d7-32b83516eb0f&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T01%3A06%3A38Z&ske=2026-09-13T01%3A06%3A38Z&sks=b&skv=2026-02-06&sig=hiqg8OTM612y%2BvU0O7TS61WEmu%2B1NoBfzYkrijdYAKc%3D'
          V21_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-f9f0-820e-9ea0-8fb5d0344091/raw?se=2026-09-12T23%3A10%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=0f8d2851-302f-5382-9472-bb86f416d3f0&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T01%3A13%3A24Z&ske=2026-09-13T01%3A13%3A24Z&sks=b&skv=2026-02-06&sig=1xGv96HJNw/0up47KC6msYYGkxSsJzzsUnhIMcLUs6c%3D'
        run: |
          set -euo pipefail
          mkdir -p /tmp/v1 /tmp/v21 BetLock-BR
          curl -L --fail --retry 2 "$V1_URL" -o /tmp/v1.zip
          curl -L --fail --retry 2 "$V21_URL" -o /tmp/v21.zip
          unzip -q /tmp/v1.zip -d /tmp/v1
          unzip -q /tmp/v21.zip -d /tmp/v21
          cp /tmp/v1/app-debug.apk BetLock-BR/BetLockBR-v1.0.0-debug.apk
          cp /tmp/v21/app-release.apk BetLock-BR/BetLockBR-v2.1.0-campus.apk
          test "$(sha256sum BetLock-BR/BetLockBR-v1.0.0-debug.apk | cut -d' ' -f1)" = "f89954db0e0ba48cf09a97fdd66b12627b05f445a35cb5e8f30431e4db030ea7"
          test "$(sha256sum BetLock-BR/BetLockBR-v2.1.0-campus.apk | cut -d' ' -f1)" = "e92dd684a1400e5bf48622074986075a07fd9e4d8ef940367aa7e7524b05e7bd"
      - name: Publish to BetLock branch
        shell: bash
        run: |
          git config user.name "BetLock Build"
          git config user.email "actions@users.noreply.github.com"
          git add BetLock-BR/BetLockBR-v1.0.0-debug.apk BetLock-BR/BetLockBR-v2.1.0-campus.apk
          git commit -m "Publish BetLock BR Campus APKs"
          git push origin HEAD:betlock-br
